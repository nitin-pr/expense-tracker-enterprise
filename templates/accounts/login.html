{% extends "base.html" %}
{% load static %}
{% block title %}Log In - Expense Tracker{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="auth-brand-icon"><i class="bi bi-wallet2"></i></span>
            <h1>Expense Tracker</h1>
        </div>
        <h2 class="h5 mb-3 text-center">Log In</h2>
        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>
        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password"
                    required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>
        <div class="auth-footer-links mt-3">
            <p class="mb-1"><a href="{% url 'forgot_password' %}">Forgot password?</a></p>
            <p class="mb-0"><a href="{% url 'signup' %}">Need an account? Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/login.js' %}"></script>
{% endblock %}
