{% extends "base.html" %}
{% load static %}
{% block title %}Log In - Expense Tracker{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4">Log In</h2>
    <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>
    <form id="login-form">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password"
                required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log In</button>
    </form>
    <div id="token-display" class="mt-3 d-none">
        <label for="token-text" class="form-label text-success">Logged in! ID token (for testing):</label>
        <textarea class="form-control" rows="4" readonly id="token-text"></textarea>
    </div>
    <p class="mt-3"><a href="{% url 'signup' %}">Need an account? Sign up</a></p>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/login.js' %}"></script>
{% endblock %}
