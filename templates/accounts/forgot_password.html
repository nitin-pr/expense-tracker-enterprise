{% extends "base.html" %}
{% load static %}
{% block title %}Reset Password - Expense Tracker{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4">Reset Password</h2>
    <p class="text-muted">Enter your account email and we'll send you a link to reset your password.</p>
    <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>
    <div id="success-alert" class="alert alert-success d-none" role="alert"></div>
    <form id="forgot-password-form">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
    </form>
    <p class="mt-3"><a href="{% url 'login' %}">Back to log in</a></p>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{% static 'js/forgot-password.js' %}"></script>
{% endblock %}
